binance:
  api_key: "${BINANCE_API_KEY}"
  api_secret: "${BINANCE_API_SECRET}"
  futures_env: "testnet" # "testnet" or "real"

telegram:
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  chat_id: "${TELEGRAM_CHAT_ID}"

trading:
  symbol: "ETHUSDT"
  trade_amount: 0.1 # in ETH
  risk_percentage: 0.01 # not used yet, but kept
  timeframe: "5m"
  take_profit: 1.5 # in % (for info / strategy)
  stop_loss: 0.6 # in % (for info / strategy)
  break_even_enabled: true
  break_even_trigger_pct: 0.4
  position_file: "position_eth.json"

timing:
  price_interval_seconds: 5
  indicator_interval_seconds: 300
  loop_interval: 5 # seconds between decision checks

database:
  url: "${DATABASE_URL}"
